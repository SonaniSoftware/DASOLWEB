<div class="dev-page">
  <div class="dev-head">
    <div class="form-name">
      <p>Lookup Master</p>
    </div>
    <div class="form-head">
      <button class="btn btn-primary" (click)="add()"><span class="material-icons">add</span> New Lookup</button>
    </div>
  </div>

  @if (showForm) {
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="mb-3">{{ editKey ? 'Edit' : 'New' }} Lookup</h6>
        <div class="row g-2">
          <div class="col-md-3">
            <label class="form-label">Type *</label>
            <input class="form-control" [(ngModel)]="model.lookupType" maxlength="50" [disabled]="!!editKey" placeholder="e.g. Gender" />
          </div>
          <div class="col-md-2">
            <label class="form-label">Code</label>
            <input class="form-control" [(ngModel)]="model.lookupCode" maxlength="50" placeholder="e.g. M" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Name *</label>
            <input class="form-control" [(ngModel)]="model.lookupName" maxlength="200" placeholder="e.g. Male" />
          </div>
          <div class="col-md-1 d-flex align-items-end">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="lkAct" [(ngModel)]="model.isActive" />
              <label class="form-check-label" for="lkAct">Active</label>
            </div>
          </div>
          <div class="col-md-2 d-flex align-items-end gap-2">
            <button class="btn btn-primary" (click)="save()">Save</button>
            <button class="btn btn-light" (click)="showForm = false">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  }

  <ag-grid-angular
    class="dev-grid"
    style="width: 100%;"
    [theme]="theme"
    [rowData]="rows"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [context]="context"
    [animateRows]="true"
    [pagination]="true"
    [paginationPageSize]="20"
  ></ag-grid-angular>
</div>
