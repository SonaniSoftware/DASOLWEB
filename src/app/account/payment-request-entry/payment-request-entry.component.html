<div class="dev-page">
  <div class="dev-head">
    <div class="form-name">
      <p>Payment Request Entry</p>
    </div>
    <div class="form-head">
      <button class="btn btn-light btn-sm" (click)="back()">
        <span class="material-icons">arrow_back</span> Back to Billing List
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h6 class="mb-3">{{ billId ? 'Payment Request for Bill #' + billId : 'New Payment Request' }}</h6>
      <p class="text-muted mb-0">
        Entry form coming soon — this page is wired up and opened from the
        Billing Document List “Payment Request” button.
      </p>
    </div>
  </div>
</div>
