<div class="dev-page">
  <div class="dev-head">
    <div class="form-name">
      <p>Billing Document Entry</p>
    </div>
    <div class="form-head">
      <button class="btn btn-light btn-sm" (click)="back()">
        <span class="material-icons">arrow_back</span> Back to List
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h6 class="mb-3">{{ billId ? 'Edit Billing Document #' + billId : 'New Billing Document' }}</h6>
      <p class="text-muted mb-0">
        @if (billId) {
          Opened Bill #{{ billId }} from the list. Entry form coming soon.
        } @else {
          Entry form coming soon — opened via the “New” button.
        }
      </p>
    </div>
  </div>
</div>
