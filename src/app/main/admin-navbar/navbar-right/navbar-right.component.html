<div class="header-right">
  <button class="icon-btn" type="button" aria-label="Notifications">
    <span class="material-icons">notifications_none</span>
    <span class="badge-dot"></span>
  </button>

  <!-- Theme picker -->
  <div class="theme-dropdown" (click)="$event.stopPropagation()">
    <button class="icon-btn" type="button" aria-label="Select theme" [class.active]="themeOpen" (click)="toggleTheme($event)">
      <span class="material-icons">palette</span>
    </button>

    @if (themeOpen) {
      <div class="dropdown-panel theme-panel">
        <div class="dropdown-head">
          <div class="dh-name">Theme</div>
          <div class="dh-email">Applies across the whole app</div>
        </div>
        @for (t of theme.themes; track t.id) {
          <button
            class="theme-item"
            type="button"
            [class.active]="t.id === theme.current().id"
            (click)="selectTheme(t.id)"
          >
            <span class="swatch" [class.is-dark]="t.mode === 'dark'" [style.background]="t.primary"></span>
            <span class="theme-name">{{ t.name }}</span>
            <span class="theme-mode">{{ t.mode }}</span>
            @if (t.id === theme.current().id) {
              <span class="material-icons check">check</span>
            }
          </button>
        }
      </div>
    }
  </div>

  <div class="user-dropdown" (click)="$event.stopPropagation()">
    <button class="user-btn" type="button" (click)="toggle($event)">
      <span class="avatar">{{ initials }}</span>
      <span class="user-meta d-none d-sm-flex">
        <span class="user-name">{{ displayName }}</span>
        <span class="user-role">{{ user?.companyName || 'DA Sol' }}</span>
      </span>
      <span class="material-icons chevron">expand_more</span>
    </button>

    @if (open) {
      <div class="dropdown-panel">
        <div class="dropdown-head">
          <div class="dh-name">{{ displayName }}</div>
          @if (user?.email) {
            <div class="dh-email">{{ user?.email }}</div>
          }
        </div>
        <a class="dropdown-item" href="javascript:void(0)">
          <span class="material-icons">person</span> Profile
        </a>
        <a class="dropdown-item" href="javascript:void(0)">
          <span class="material-icons">settings</span> Settings
        </a>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item danger" type="button" (click)="logout()">
          <span class="material-icons">logout</span> Logout
        </button>
      </div>
    }
  </div>
</div>
