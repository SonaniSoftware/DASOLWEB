<div class="dev-page">
  <div class="dev-head">
    <div class="form-name">
      <p>Vendor Master</p>
    </div>
    <div class="form-head">
      <button class="btn btn-primary" (click)="add()"><span class="material-icons">add</span> New Vendor</button>
    </div>
  </div>

  @if (showForm) {
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="mb-3">{{ editId ? 'Edit' : 'New' }} Vendor Entry</h6>

        <!-- Tabs -->
        <div class="vendor-tabs">
          <button type="button" class="vendor-tab" [class.active]="activeTab === 'general'" (click)="activeTab = 'general'">
            <span class="material-icons">badge</span> General Detail
          </button>
          <button type="button" class="vendor-tab" [class.active]="activeTab === 'verify'" (click)="activeTab = 'verify'">
            <span class="material-icons">verified</span> Vendor Verify
          </button>
          <button type="button" class="vendor-tab" [class.active]="activeTab === 'account'" (click)="activeTab = 'account'">
            <span class="material-icons">account_balance</span> Account Detail
          </button>
        </div>

        <!-- General Detail -->
        @if (activeTab === 'general') {
          <div class="row g-2">
            <div class="col-md-3">
              <label class="form-label">Vendor Code *</label>
              <input class="form-control" [(ngModel)]="model.vendorCode" maxlength="20" [disabled]="!!editId" placeholder="e.g. VEN001" />
            </div>
            <div class="col-md-5">
              <label class="form-label">Vendor Name *</label>
              <input class="form-control" [(ngModel)]="model.vendorName" maxlength="200" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Vendor Type</label>
              <input class="form-control" [(ngModel)]="model.vendorType" maxlength="50" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Category</label>
              <input class="form-control" [(ngModel)]="model.category" maxlength="50" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Business Type</label>
              <input class="form-control" [(ngModel)]="model.businessType" maxlength="50" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Contact Person</label>
              <input class="form-control" [(ngModel)]="model.contactPerson" maxlength="100" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Mobile No 1</label>
              <input class="form-control" [(ngModel)]="model.mobileNo1" maxlength="20" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Mobile No 2</label>
              <input class="form-control" [(ngModel)]="model.mobileNo2" maxlength="20" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Phone No</label>
              <input class="form-control" [(ngModel)]="model.phoneNo" maxlength="30" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Email</label>
              <input class="form-control" type="email" [(ngModel)]="model.emailId" maxlength="200" />
            </div>
            <div class="col-md-5">
              <label class="form-label">Website</label>
              <input class="form-control" [(ngModel)]="model.website" maxlength="200" />
            </div>
            <div class="col-md-8">
              <label class="form-label">Address</label>
              <input class="form-control" [(ngModel)]="model.address" maxlength="250" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Area</label>
              <input class="form-control" [(ngModel)]="model.area" maxlength="250" />
            </div>
            <div class="col-md-3">
              <label class="form-label">City</label>
              <input class="form-control" [(ngModel)]="model.city" maxlength="100" />
            </div>
            <div class="col-md-3">
              <label class="form-label">District</label>
              <input class="form-control" [(ngModel)]="model.district" maxlength="100" />
            </div>
            <div class="col-md-2">
              <label class="form-label">State</label>
              <input class="form-control" [(ngModel)]="model.state" maxlength="100" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Country</label>
              <input class="form-control" [(ngModel)]="model.country" maxlength="100" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Pincode</label>
              <input class="form-control" [(ngModel)]="model.pincode" maxlength="10" />
            </div>
            <div class="col-md-12">
              <label class="form-label">Remark</label>
              <input class="form-control" [(ngModel)]="model.remark" maxlength="500" />
            </div>
          </div>
        }

        <!-- Vendor Verify -->
        @if (activeTab === 'verify') {
          <div class="row g-2">
            <div class="col-md-3">
              <label class="form-label">GST No</label>
              <input class="form-control" [(ngModel)]="model.gstNo" maxlength="20" />
            </div>
            <div class="col-md-3">
              <label class="form-label">PAN No</label>
              <input class="form-control" [(ngModel)]="model.panNo" maxlength="20" />
            </div>
            <div class="col-md-3">
              <label class="form-label">TAN No</label>
              <input class="form-control" [(ngModel)]="model.tanNo" maxlength="20" />
            </div>
            <div class="col-md-3">
              <label class="form-label">CIN No</label>
              <input class="form-control" [(ngModel)]="model.cinNo" maxlength="30" />
            </div>
            <div class="col-12"><hr class="my-2" /></div>
            <div class="col-md-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="vnTds" [(ngModel)]="model.tdsApplicable" />
                <label class="form-check-label" for="vnTds">TDS Applicable</label>
              </div>
            </div>
            <div class="col-md-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="vnTcs" [(ngModel)]="model.tcsApplicable" />
                <label class="form-check-label" for="vnTcs">TCS Applicable</label>
              </div>
            </div>
            <div class="col-md-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="vnApprove" [(ngModel)]="model.isApprove" />
                <label class="form-check-label" for="vnApprove">Approved</label>
              </div>
            </div>
            <div class="col-md-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="vnBlocked" [(ngModel)]="model.isBlocked" />
                <label class="form-check-label" for="vnBlocked">Blocked</label>
              </div>
            </div>
            <div class="col-md-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="vnActive" [(ngModel)]="model.isActive" />
                <label class="form-check-label" for="vnActive">Active</label>
              </div>
            </div>
          </div>
        }

        <!-- Account Detail -->
        @if (activeTab === 'account') {
          <div class="row g-2">
            <div class="col-md-4">
              <label class="form-label">Bank Name</label>
              <input class="form-control" [(ngModel)]="model.bankName" maxlength="150" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Branch Name</label>
              <input class="form-control" [(ngModel)]="model.branchName" maxlength="150" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Holder Name</label>
              <input class="form-control" [(ngModel)]="model.holderName" maxlength="150" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Account No</label>
              <input class="form-control" [(ngModel)]="model.accountNo" maxlength="50" />
            </div>
            <div class="col-md-4">
              <label class="form-label">IFSC Code</label>
              <input class="form-control" [(ngModel)]="model.ifscCode" maxlength="20" />
            </div>
            <div class="col-md-4">
              <label class="form-label">UPI ID</label>
              <input class="form-control" [(ngModel)]="model.upiId" maxlength="100" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Payment Type</label>
              <input class="form-control" type="number" [(ngModel)]="model.paymentType" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Payment Terms</label>
              <input class="form-control" type="number" [(ngModel)]="model.paymentTerms" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Credit Limit</label>
              <input class="form-control" type="number" step="0.01" [(ngModel)]="model.creditLimit" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Currency</label>
              <input class="form-control" [(ngModel)]="model.currencyCode" maxlength="10" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Ledger Code</label>
              <input class="form-control" [(ngModel)]="model.ledgerCode" maxlength="30" />
            </div>
          </div>
        }

        <!-- Actions -->
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary" (click)="save()">Save</button>
          <button class="btn btn-light" (click)="showForm = false">Cancel</button>
        </div>
      </div>
    </div>
  }

  <ag-grid-angular
    class="dev-grid"
    style="width: 100%;"
    [theme]="theme"
    [rowData]="rows"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [context]="context"
    [animateRows]="true"
    [pagination]="true"
    [paginationPageSize]="20"
  ></ag-grid-angular>
</div>
